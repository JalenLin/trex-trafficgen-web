# Tests that need no TRex: the backend API against mock hosts, and the web UI in a
# browser against mock hosts. Tests against real TRex hosts need a cabled loopback
# and are run by hand (tests/README.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend API (mock)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e 'backend[mock,test]'
      - name: pytest
        run: backend/.venv/bin/python -m pytest tests/backend -q -rfEs

  frontend:
    name: Frontend build and browser tests (mock)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -e 'backend[mock]'
      - name: Type check and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: UI text check (zh-TW / en)
        working-directory: frontend
        run: npm run check:i18n
      - name: Install browser
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Browser tests
        working-directory: tests/e2e
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
        run: node run.mjs
      - name: Upload screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: ${{ runner.temp }}/e2e
          retention-days: 14
